Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoAddGPU" "false"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection
Section "Device"
    Identifier "R9stFramebuffer"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
    Option "ShadowFB" "true"
EndSection
Section "Monitor"
    Identifier "Panel"
    DisplaySize 62 110
EndSection
Section "Screen"
    Identifier "R9stScreen"
    Device "R9stFramebuffer"
    Monitor "Panel"
    DefaultDepth 24
EndSection
Section "InputDevice"
    Identifier "Touchscreen"
    Driver "libinput"
    Option "Device" "/dev/input/event3"
    Option "CorePointer"
EndSection
Section "ServerLayout"
    Identifier "R9stLayout"
    Screen "R9stScreen"
    InputDevice "Touchscreen" "CorePointer"
EndSection
